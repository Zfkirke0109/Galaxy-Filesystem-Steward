name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :core:test --console=plain

      - name: End-to-end app test (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint and build APKs
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-steward-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
